<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apoplanesia Photo | Fotografia por Eva Santos • Porto</title>
  <meta name="description" content="Fotografia natural, humana e emotiva por Eva Santos no Porto e em todo o Portugal. Sessões de casais, retratos, maternidade, boudoir e eventos com alma e sensibilidade." />
  <link rel="icon" type="image/png" href="/assets/branding/logo-roxo.png" />
  <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
  <link rel="canonical" href="https://apoplanesiaphoto.com/" />
  
  <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    @media (max-width: 820px) {
      .desktop-nav { display: none !important; }
      .mobile-menu-btn { display: flex !important; }
    }
  </style>

  <!-- Photo Protection: Prevent "Save Image As" and drag-drop saving -->
  <script>
    document.addEventListener('contextmenu', function(e) {
      if (e.target.tagName === 'IMG' || e.target.closest('.gallery-photo-item') || e.target.closest('.lightbox-content') || e.target.closest('.category-card')) {
        e.preventDefault();
        return false;
      }
    }, false);

    document.addEventListener('dragstart', function(e) {
      if (e.target.tagName === 'IMG') {
        e.preventDefault();
        return false;
      }
    }, false);
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
